name: Java CI
on:
  push:
    branches:
    - master
    - '[1-9]+.[0-9]+.x'
  pull_request:
    branches:
    - master
    - '[1-9]+.[0-9]+.x'
jobs:
  build:
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - name: Verify workflow action pins
      run: .github/scripts/check-workflow-action-pinning.sh
    - name: Set up JDK
      uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3
      with:
        distribution: 'temurin'
        java-version: '25'
    - name: "🔧 Setup Gradle"
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
    - name: Check plugin
      run: ./gradlew check
      env:
        GH_TOKEN_PUBLIC_REPOS_READONLY: ${{ secrets.GH_TOKEN_PUBLIC_REPOS_READONLY }}
        GH_USERNAME: ${{ secrets.GH_USERNAME }}
        GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
        GRADLE_ENTERPRISE_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
        GRADLE_ENTERPRISE_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
    - name: Publish Test Report
      if: ${{ always() }}
      uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
      with:
        check_name: Java CI / Test Report
        report_paths: '**/build/test-results/*/TEST-*.xml'
    - name: Publish to Sonatype OSSRH
      if: github.event_name == 'push'
      env:
        SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
        GPG_FILE: ${{ secrets.GPG_FILE }}
        GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
        GRADLE_ENTERPRISE_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
        GRADLE_ENTERPRISE_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
      run: |
        echo $GPG_FILE | base64 -d > secring.gpg
        ./gradlew publish
