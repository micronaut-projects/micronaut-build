[versions]
asciidoctorj = "3.0.0"
jsoup = "1.18.3"
commons-lang3 = "3.18.0"
commons-text = "1.14.0"
japicmp-plugin = "0.4.6"
gradle-custom-userdata-plugin = "2.3"
develocity-plugin = "4.2.2"
gradle-github-actions-plugin = "1.4.0"
grails-gdoc = "1.0.1"
graalvm-native-build-tools = "0.11.5"
mockserver = "2.0.4"
nexus-publish-plugin = "2.0.0"
snakeyaml = "2.5"
sonar-plugin = "6.3.1.5724"
spock = "2.4-groovy-5.0"
spotless-plugin = "7.2.1"
testlogger-plugin = "4.0.0"
tomlj = "1.1.1"
typesafe-config = "1.4.5"
bytebuddy = "1.17.8"
objenesis = "3.4"
maven-model-builder = "3.9.11"
includegit = "0.3.0"
sonatype-scan = "3.0.0"
errorprone = "4.3.0"
bouncycastle = "1.82"
micronaut-docs = "3.0.0"
micronaut-test = "5.0.0-M5"
micronaut-logging = "2.0.0-M2"
groovy = "5.0.4"
junit6 = "6.0.1"
logback = "1.5.20"
checkstyle = "12.1.0"
kotlin = "2.3.0"
kotlin-ksp = "2.3.6"

[libraries]
asciidoctorj = { module = "org.asciidoctor:asciidoctorj", version.ref = "asciidoctorj" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
bytebuddy = { module = "net.bytebuddy:byte-buddy", version.ref = "bytebuddy" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
commons-text = { module = "org.apache.commons:commons-text", version.ref = "commons-text" }
japicmp-plugin = { module = "me.champeau.gradle:japicmp-gradle-plugin", version.ref = "japicmp-plugin" }
gradle-custom-userdata-plugin = { module = "com.gradle:common-custom-user-data-gradle-plugin", version.ref = "gradle-custom-userdata-plugin" }
develocity-plugin = { module = "com.gradle:develocity-gradle-plugin", version.ref = "develocity-plugin" }
gradle-github-actions-plugin = { module = "org.nosphere.gradle.github:gradle-github-actions-plugin", version.ref = "gradle-github-actions-plugin" }
grails-gdoc = { module = "org.grails:grails-gdoc-engine", version.ref = "grails-gdoc" }
graalvm-native-gradle-plugin = { module = "org.graalvm.buildtools:native-gradle-plugin", version.ref = "graalvm-native-build-tools" }
nexus-publish-plugin = { module = "io.github.gradle-nexus:publish-plugin", version.ref = "nexus-publish-plugin" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
sonar-plugin = { module = "org.sonarsource.scanner.gradle:sonarqube-gradle-plugin", version.ref = "sonar-plugin" }
spock-bom = { module = "org.spockframework:spock-bom", version.ref = "spock" }
spock-core = { module = "org.spockframework:spock-core", version.ref = "spock" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless-plugin" }
testlogger-plugin = { module = "com.adarshr:gradle-test-logger-plugin", version.ref = "testlogger-plugin" }
tomlj = { module = "org.tomlj:tomlj", version.ref = "tomlj" }
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafe-config" }
objenesis = { module = "org.objenesis:objenesis", version.ref = "objenesis" }
maven-model-builder = { module = "org.apache.maven:maven-model-builder", version.ref = "maven-model-builder" }
includegit-plugin = { module = "me.champeau.gradle.includegit:plugin", version.ref = "includegit" }
sonatype-scan-plugin = { module = "org.sonatype.gradle.plugins:scan-gradle-plugin", version.ref = "sonatype-scan" }
bc-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bc-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
micronaut-docs = { module = "io.micronaut.docs:micronaut-docs-asciidoc-config-props", version.ref = "micronaut-docs" }
micronaut-logging = { module = "io.micronaut.logging:micronaut-logging", version.ref = "micronaut-logging" }
micronaut-test = { module = "io.micronaut.test:micronaut-test", version.ref = "micronaut-test" }
groovy = { module = "org.codehaus.groovy:groovy-core", version.ref = "groovy" }
mockserver-client = { module = "software.xdev.mockserver:client", version.ref = "mockserver" }
mockserver-server = { module = "software.xdev.mockserver:server", version.ref = "mockserver" }

junit6-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit6" }
junit6-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit6" }
junit6-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit6" }

logback = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
checkstyle = { module = "com.puppycrawl.tools:checkstyle", version.ref = "checkstyle"}

kotlin-jvm-plugin = { module = "org.jetbrains.kotlin.jvm:org.jetbrains.kotlin.jvm.gradle.plugin", version.ref = "kotlin" }
kotlin-kapt-plugin = { module = "org.jetbrains.kotlin.kapt:org.jetbrains.kotlin.kapt.gradle.plugin", version.ref = "kotlin" }
kotlin-ksp-plugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "kotlin-ksp" }

[bundles]
bouncycastle = ["bc-prov", "bc-pkix"]
