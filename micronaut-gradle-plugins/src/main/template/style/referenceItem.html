<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
                      "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
    <title>{{title}} {{version}}</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <link rel="stylesheet" href="{{resourcesPath}}/css/custom.css" type="text/css" media="screen, print" title="Style" charset="utf-8"/>
    <script type="text/javascript">
function addJsClass(el) {
    var classes = document.body.className.split(" ");
    classes.push("js");
    document.body.className = classes.join(" ");
}
    </script>
    <style>
        .contribute-btn {
            bottom: 0px;
        }
    </style>
</head>

<body class="body docs-shell" onload="addJsClass();">

<div id="navigation">
    <div class="navTitle">
        {{#if logo}}
        <span id="logo">{{{logo}}}</span>
        {{/if}}
        {{docTitle}}
    </div>

    <div class="navLinks">
        <ul>
            <li>
                <div id="nav-summary" onmouseover="toggleNavSummary(false)" onmouseout="toggleNavSummary(true)">
                    <a href="{{path}}/guide/index.html" class="button">Table of contents</a>

                    <div id="nav-summary-childs">
{{{guideSummaryItemsHtml}}}
                    </div>
                </div>
            </li>
            <li class="separator selected">
                <a id="ref-button" onclick="localToggle(); return false;" href="#">Quick Reference</a>
            </li>
        </ul>
    </div>
</div>

<table id="colset" border="0" cellpadding="0" cellspacing="0">
    <tr>
        <td id="col1">
            <div id="main" class="reference corner-all">

                <span id='toggle-col1' class="toggle">(<a href="#" onclick="localToggle(); return false;">Quick Reference</a>)</span>
                {{#if sourceRepo}}
                <div class='contribute-btn'>
                    <button type='button' class='btn btn-default' onclick='window.location.href="{{sourceRepo}}/{{sourcePath}}"'>
                        <svg class="button-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <path d="M12 20h9" />
                            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
                        </svg>
                        <span>Improve this doc</span>
                    </button>
                </div>
                {{/if}}

                {{{content}}}
            </div>
        </td>
        <td id="col2">
            <div class="local clearfix">
                <div class="local-title">
                    <a href="{{path}}/guide/index.html" target="mainFrame">Quick Reference</a>
                    <span class="toggle">(<a href="#" onclick="localToggle(); return false;">hide</a>)</span>
                </div>
                <div class="menu">
{{{refMenuHtml}}}
                </div>
            </div>
        </td>
    </tr>
</table>

<div id="footer">
    {{{copyright}}}
    {{{footer}}}
</div>

<script type="text/javascript" src="{{resourcesPath}}/js/docs.js"></script>

</body>
</html>
