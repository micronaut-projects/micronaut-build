<!doctype html>
<html lang="en">
<head>
    <title>{{title}}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
        (function () {
            try {
                var theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                if (theme === "dark") {
                    document.documentElement.classList.add("dark-mode");
                }
            } catch (e) {
                // Ignore storage access errors when the docs are opened from file://.
            }
        })();
    </script>
    <link rel="stylesheet" href="{{resourcesPath}}/css/custom.css" type="text/css" media="screen, print" title="Style" charset="utf-8" />
    <link rel="stylesheet" href="{{resourcesPath}}/css/multi-language-sample.css" />
    <script src="{{resourcesPath}}/js/highlight.pack.js"></script>
    <script src="{{resourcesPath}}/js/guide.js"></script>
    <script src="{{resourcesPath}}/js/multi-language-sample.js"></script>
    <script>hljs.initHighlightingOnLoad();</script>
    <script src="{{resourcesPath}}/js/docs.js"></script>
    <style type="text/css">
        {{{extraCss}}}
    </style>
</head>

<body class="body docs-shell" id="docs" onload="addJsClass();" onhashchange="highlightMenu()">
<div class="app-shell">
    {{#if toc}}
    <aside id="table-of-content" class="sidebar no-print" aria-label="Table of contents">
        <div class="sidebar-header">
            <a class="sidebar-brand" href="{{path}}/guide/index.html" aria-label="Micronaut Docs">
                <span class="sidebar-logo-wrap" aria-hidden="true">
                    <img class="sidebar-logo" src="{{resourcesPath}}/img/micronaut-logo-white.svg" alt="" />
                </span>
            </a>
        </div>
        <nav class="toc-content sidebar-content" aria-label="Guide sections">
            <div class="sidebar-group-heading">
                <span class="sidebar-group-label">Table of Contents</span>
            </div>
            <div class="toc-tree">
{{{tocTreeHtml}}}
            </div>
        </nav>
    </aside>
    {{/if}}
    <div class="app-main">
        <header id="navigation" class="topbar no-print">
            <button class="sidebar-toggle mobile" type="button" aria-controls="table-of-content" aria-expanded="false" title="Open sidebar" aria-label="Open sidebar" onclick="toggleSidebar();">
                <svg class="trigger-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M4 6h16" />
                    <path d="M4 12h16" />
                    <path d="M4 18h16" />
                </svg>
            </button>
            {{#if toc}}
            <button class="sidebar-collapse desktop" type="button" aria-controls="table-of-content" aria-expanded="true" title="Collapse sidebar" aria-label="Collapse sidebar" onclick="toggleTableOfContents();">
                <svg class="trigger-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <rect width="18" height="18" x="3" y="3" rx="2" />
                    <path d="M9 3v18" />
                </svg>
            </button>
            <span class="topbar-separator desktop" aria-hidden="true"></span>
            {{/if}}
            <nav class="topbar-title" aria-label="Breadcrumb">
                <a href="{{path}}/guide/index.html">Micronaut Docs</a>
                <span aria-hidden="true">/</span>
                <span>{{title}}</span>
            </nav>
            <div class="topbar-actions">
                <a class="topbar-link desktop" title="Go to API documentation" href="{{path}}/api/index.html">API</a>
                <a class="topbar-link desktop" title="Go to Configuration Reference documentation" href="{{path}}/guide/configurationreference.html">Configuration</a>
                <button id="theme-switcher" class="theme-toggle" type="button" title="Switch to dark theme" aria-label="Switch to dark theme" aria-pressed="false" onclick="switchTheme(true);">
                    <span class="theme-icon theme-icon-moon" aria-hidden="true">
                        <svg class="theme-icon-svg" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                            <path d="M20.99 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 20.99 12.79z" />
                        </svg>
                    </span>
                    <span class="theme-icon theme-icon-sun" aria-hidden="true">
                        <svg class="theme-icon-svg" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                            <circle cx="12" cy="12" r="4" />
                            <path d="M12 2v2" />
                            <path d="M12 20v2" />
                            <path d="m4.93 4.93 1.41 1.41" />
                            <path d="m17.66 17.66 1.41 1.41" />
                            <path d="M2 12h2" />
                            <path d="M20 12h2" />
                            <path d="m6.34 17.66-1.41 1.41" />
                            <path d="m19.07 4.93-1.41 1.41" />
                        </svg>
                    </span>
                </button>
            </div>
        </header>
        <main id="main" class="content">
            <article class="docs-content guide-document">
                <div class="project">
                    <h1>{{title}}</h1>
                    <p>{{subtitle}}</p>
                    <p><strong>Version:</strong> {{version}}</p>
                </div>
                {{{content}}}
            </article>
        </main>
    </div>
</div>
</body>
</html>
